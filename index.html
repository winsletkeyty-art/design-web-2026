
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Vue.js - Aula 01</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-sm">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body gap-4">
                <h1 class="text-2xl font-bold text-center">Calculadora Vue.js</h1>

                <div class="bg-neutral text-neutral-content rounded-xl p-5 text-right">
                    <div class="text-4xl font-bold break-all">{{ display }}</div>
                </div>

                <div class="grid grid-cols-4 gap-2">
                    <button class="btn btn-error" @click="clear">C</button>
                    <button class="btn" @click="setOperator('/')">÷</button>
                    <button class="btn" @click="setOperator('*')">×</button>
                    <button class="btn" @click="setOperator('-')">−</button>

                    <button class="btn" @click="appendDigit('7')">7</button>
                    <button class="btn" @click="appendDigit('8')">8</button>
                    <button class="btn" @click="appendDigit('9')">9</button>
                    <button class="btn" @click="setOperator('+')">+</button>

                    <button class="btn" @click="appendDigit('4')">4</button>
                    <button class="btn" @click="appendDigit('5')">5</button>
                    <button class="btn" @click="appendDigit('6')">6</button>
                    <button class="btn btn-primary row-span-2 h-auto" @click="calculate">=</button>

                    <button class="btn" @click="appendDigit('1')">1</button>
                    <button class="btn" @click="appendDigit('2')">2</button>
                    <button class="btn" @click="appendDigit('3')">3</button>

                    <button class="btn col-span-2" @click="appendDigit('0')">0</button>
                    <button class="btn" @click="clear">Limpar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    display: '0',
                    firstOperand: null,
                    operator: null,
                    waitingForSecond: false
                };
            },

            methods: {
                clear() {
                    this.display = '0';
                    this.firstOperand = null;
                    this.operator = null;
                    this.waitingForSecond = false;
                },

                appendDigit(digit) {
                    if (this.waitingForSecond) {
                        this.display = digit;
                        this.waitingForSecond = false;
                    } else if (this.display === '0' || this.display === 'Erro') {
                        this.display = digit;
                    } else {
                        this.display = this.display + digit;
                    }
                },

                setOperator(op) {
                    if (this.display === 'Erro') {
                        return;
                    }

                    if (this.operator !== null && this.waitingForSecond === false) {
                        this.calculate();
                    }

                    this.firstOperand = parseFloat(this.display);
                    this.operator = op;
                    this.waitingForSecond = true;
                },

                calculate() {
                    if (this.operator === null || this.firstOperand === null) {
                        return;
                    }

                    const a = this.firstOperand;
                    const b = parseFloat(this.display);
                    let resultado;

                    if (this.operator === '+') {
                        resultado = a + b;
                    } else if (this.operator === '-') {
                        resultado = a - b;
                    } else if (this.operator === '*') {
                        resultado = a * b;
                    } else if (this.operator === '/') {
                        if (b === 0) {
                            resultado = 'Erro';
                        } else {
                            resultado = a / b;
                        }
                    }

                    this.display = String(resultado);
                    this.firstOperand = null;
                    this.operator = null;
                    this.waitingForSecond = true;
                }
            }
        }).mount('#app');
    </script>

</body>

</html>
